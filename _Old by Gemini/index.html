<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="OpenCivilToolkit - Ein modulares Web-App-Toolkit für Bauingenieure zur Berechnung von Beton, Stahl und Plattenanalysen.">
  <title>OpenCivilToolkitSIA</title>
  
  <!-- KaTeX CSS for beautiful math equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" crossorigin="anonymous">
  
  <!-- Custom design stylesheet -->
  <link rel="stylesheet" href="style.css">
  
  <!-- KaTeX JS (loaded before our main app modules run) -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js" crossorigin="anonymous"></script>
  
  <!-- SVG Pan Zoom for interactive diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>
</head>
<body>

  <!-- Sleek Top Bar -->
  <header class="top-bar" id="app-header">
    <div class="header-logo" id="logo-container">
      <span class="logo-prefix">Open</span><span class="logo-suffix">CivilToolkit<span style="color: #ef4444; font-weight: 800;">SIA</span></span>
    </div>
    
    <!-- Dynamic App Buttons Navigation -->
    <nav class="app-nav" id="app-navigation" aria-label="Apps"></nav>
    
    <!-- System Controls / Status -->
    <div class="header-controls">
      <span class="status-indicator saved" id="status-text">
        <span class="status-dot"></span> Synchronisiert
      </span>
      <button class="btn btn-icon-only" id="btn-import" title="Projekt laden (JSON)">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M14 10l-4-4-4 4M10 6v9"/>
        </svg>
      </button>
      <button class="btn btn-icon-only" id="btn-export" title="Projekt speichern (JSON)">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5 5-5-5M12 13V3"/>
        </svg>
      </button>
      <button class="btn btn-icon-only btn-danger" id="btn-clear" title="Alles löschen">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Interactive 3-Column Resizable Layout -->
  <main class="app-layout" id="main-layout">
    <!-- Left Column: Instances Tab List -->
    <section class="panel" id="left-panel" aria-label="Instanzenleiste"></section>
    
    <!-- Splitter Resizer 1 -->
    <div class="resizer" id="resizer-left" role="separator" aria-valuenow="250" aria-valuemin="180" aria-valuemax="500" title="Linke Spalte anpassen"></div>
    
    <!-- Middle Column: Parameter Inputs Form -->
    <section class="panel" id="middle-panel" aria-label="Eingabemaske"></section>
    
    <!-- Splitter Resizer 2 -->
    <div class="resizer" id="resizer-right" role="separator" aria-valuenow="450" aria-valuemin="300" aria-valuemax="800" title="Rechte Spalte anpassen"></div>
    
    <!-- Right Column: LaTeX Output and Reports -->
    <section class="panel" id="right-panel" aria-label="LaTeX Bericht"></section>
  </main>

  <!-- Hidden Import File Input -->
  <input type="file" id="import-file-input" style="display:none" accept=".json">

  <!-- Main JavaScript Controller -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
