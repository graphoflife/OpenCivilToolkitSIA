<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCivilToolkitSIA</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <script defer src="vendor/katex/katex.min.js"></script>
  <!-- Versionsmarken: geschrieben von «python3 -m opencivil.web.bruecke», nicht von Hand ändern -->
  <link rel="stylesheet" href="./css/stil.css?v=8e997d7ca5eb">
  <script type="importmap">
  {
    "imports": {
      "./js/ablage.js": "./js/ablage.js?v=a67aeb3de570",
      "./js/achsen.js": "./js/achsen.js?v=87b48bf3c1f9",
      "./js/api.js": "./js/api.js?v=bd0cbd757304",
      "./js/app.js": "./js/app.js?v=b2a92b5fa1ef",
      "./js/baum.js": "./js/baum.js?v=0ca19cebb2d1",
      "./js/bausteine.js": "./js/bausteine.js?v=5e4ad56bf79b",
      "./js/bericht.js": "./js/bericht.js?v=43b213f8ab94",
      "./js/cad_ansicht.js": "./js/cad_ansicht.js?v=2f4330d5bf1f",
      "./js/cad_auswahl.js": "./js/cad_auswahl.js?v=1a71eabe1de6",
      "./js/cad_befehle.js": "./js/cad_befehle.js?v=2c5c85ed981e",
      "./js/cad_eingabe.js": "./js/cad_eingabe.js?v=bfc3098c169b",
      "./js/cad_fenster.js": "./js/cad_fenster.js?v=3f804b3c1623",
      "./js/cad_modell.js": "./js/cad_modell.js?v=d7a91c598096",
      "./js/cad_palette.js": "./js/cad_palette.js?v=d4ec92ee6165",
      "./js/diagramm.js": "./js/diagramm.js?v=afc3acde6f3a",
      "./js/dom.js": "./js/dom.js?v=c25fa011a69f",
      "./js/editor.js": "./js/editor.js?v=d228b6bceebe",
      "./js/gleichungen.js": "./js/gleichungen.js?v=df80597c166a",
      "./js/kern.js": "./js/kern.js?v=dc39e6201373",
      "./js/kern_arbeiter.js": "./js/kern_arbeiter.js?v=7a1bf252b89f",
      "./js/lagen.js": "./js/lagen.js?v=d1de89b1b40b",
      "./js/mathe.js": "./js/mathe.js?v=fa933d1b76f8",
      "./js/nachweise.js": "./js/nachweise.js?v=b00ca0397388",
      "./js/qa_diagramme.js": "./js/qa_diagramme.js?v=399f79cbd2fb",
      "./js/qa_uebersicht.js": "./js/qa_uebersicht.js?v=e1334817f2c1",
      "./js/qa_vorlagen.js": "./js/qa_vorlagen.js?v=bcb219f987e3",
      "./js/qa_zeichnung.js": "./js/qa_zeichnung.js?v=565624ecfc04",
      "./js/querschnittsanalyse.js": "./js/querschnittsanalyse.js?v=d524f5aa5c3d",
      "./js/spannungsbild.js": "./js/spannungsbild.js?v=2ba5fd75dd05",
      "./js/zustand.js": "./js/zustand.js?v=474e82c0a02a",
      "./kern/dateien.json": "./kern/dateien.json?v=794936548526",

  <!-- Ende der Versionsmarken -->
  <!-- Eingebunden statt mit src: nur so geht auch app.js über die Importtafel
       und bekommt seine Marke. -->
  <script type="module">import './js/app.js';</script>
</head>
<body>

<!--
  Der Ladeschirm steht im HTML und nicht im JavaScript: Pyodide braucht ein
  paar Sekunden, und die will niemand vor einer leeren Seite verbringen.
  app.js nimmt ihn weg, sobald der Kern antwortet.
-->
<div id="ladeschirm" class="ladeschirm">
  <div class="lade-marke">Open<span>CivilToolkit</span><em>SIA</em></div>
  <div class="lade-balken"><i></i></div>
  <p id="ladetext">Rechenkern wird gesucht …</p>
  <p class="lade-fussnote">
    Die Berechnung läuft in Python, im Browser. Beim ersten Aufruf lädt dafür
    einmalig die Python-Laufzeit; danach liegt sie im Zwischenspeicher.
  </p>
</div>

<header class="kopfleiste">
  <div class="marke">Open<span>CivilToolkit</span><em>SIA</em></div>

  <input id="projektname" class="projektname" type="text" aria-label="Projektname">

  <div class="kopf-knoepfe">
    <button id="btn-rechnen" class="knopf knopf-haupt" title="Alle Nachweise rechnen">
      Rechnen
    </button>
    <button id="btn-speichern" class="knopf"
            title="Projekt als .json-Datei herunterladen (im Browser liegt es ohnehin)">
      Speichern
    </button>
    <button id="btn-oeffnen" class="knopf" title="Projekt aus einer .json-Datei laden">
      Öffnen
    </button>
    <button id="btn-bericht" class="knopf" title="LaTeX-Dokument erzeugen">
      Bericht
    </button>
  </div>

  <div id="zustandsanzeige" class="zustandsanzeige" role="status" aria-live="polite"></div>
</header>

<main class="raster" id="raster">

  <!-- ---------------------------------------------------------------- -->
  <section class="tafel tafel-links" id="tafel-baum">
    <div class="tafel-kopf">
      <h2>Projekt</h2>
    </div>
    <div class="tafel-inhalt" id="baum"></div>
  </section>

  <div class="griff" data-griff="links" role="separator" aria-orientation="vertical"
       title="Breite des Projektbaums ziehen"></div>

  <!-- ---------------------------------------------------------------- -->
  <section class="tafel tafel-mitte" id="tafel-editor">
    <div class="tafel-kopf">
      <h2 id="editor-titel">Eingaben</h2>
      <span class="tafel-hinweis" id="editor-hinweis"></span>
    </div>
    <div class="tafel-inhalt panelstapel" id="editor"></div>
  </section>

  <div class="griff" data-griff="mitte" role="separator" aria-orientation="vertical"
       title="Breite der Eingaben ziehen"></div>

  <!-- ---------------------------------------------------------------- -->
  <section class="tafel tafel-rechts" id="tafel-bericht">
    <div class="tafel-kopf">
      <h2>Berechnung</h2>
      <span class="schalter" id="umfang" title="Alles zeigen oder nur den links gewählten Bestandteil">
        <button class="schalter-halb ist-an" data-umfang="seite">Aktuelle Seite</button>
        <button class="schalter-halb" data-umfang="gesamt">Gesamt</button>
      </span>
      <div class="reiter" id="reiter">
        <button class="reiter-knopf ist-aktiv" data-reiter="nachweise">Zusammenfassung</button>
        <button class="reiter-knopf" data-reiter="diagramm">Diagramme</button>
        <button class="reiter-knopf" data-reiter="herleitung">Herleitung</button>
        <button class="reiter-knopf" data-reiter="formelsammlung">Formelsammlung</button>
      </div>
    </div>
    <div class="tafel-inhalt" id="bericht"></div>
  </section>

</main>

<!-- Nur auf schmalen Geräten sichtbar: dort steht immer eine Tafel allein, und
     hiermit wechselt man zwischen ihnen. Dasselbe Reiter-Muster wie oben
     rechts in der Berechnung -- es soll nicht zwei Arten geben, in diesem
     Werkzeug umzuschalten. Unten, weil der Daumen dort ist. -->
<nav class="tafelwahl reiter" id="tafelwahl" aria-label="Tafel wählen">
  <button class="reiter-knopf" data-tafel="links">Projekt</button>
  <button class="reiter-knopf ist-aktiv" data-tafel="mitte">Eingaben</button>
  <button class="reiter-knopf" data-tafel="rechts">Berechnung</button>
</nav>

<footer class="fussleiste">
  <span id="kernanzeige" class="kernanzeige" title="Wo gerechnet wird"></span>
</footer>

<div id="melder" class="melder" aria-live="polite"></div>

<dialog id="dialog" class="dialog">
  <div class="dialog-kopf">
    <h3 id="dialog-titel"></h3>
    <button class="dialog-schliessen" id="dialog-schliessen"
            title="Schliessen" aria-label="Schliessen">&#215;</button>
  </div>
  <div class="dialog-inhalt" id="dialog-inhalt"></div>
</dialog>

</body>
</html>
