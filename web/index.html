<body>

<!--
  Der Ladeschirm steht im HTML und nicht im JavaScript: Pyodide braucht ein
  paar Sekunden, und die will niemand vor einer leeren Seite verbringen.
  app.js nimmt ihn weg, sobald der Kern antwortet.
-->
<div id="ladeschirm" class="ladeschirm">
  <div class="lade-marke">Open<span>CivilToolkit</span><em>SIA</em></div>
  <p class="lade-autor">von Stefan Beeler</p>
  <div class="lade-balken"><i></i></div>
  <p id="ladetext">Rechenkern wird gesucht …</p>
  <p class="lade-fussnote">
    Die Berechnung läuft in Python, im Browser. Beim ersten Aufruf lädt dafür
    einmalig die Python-Laufzeit; danach liegt sie im Zwischenspeicher.
  </p>
</div>

<header class="kopfleiste">
  <div class="marke">Open<span>CivilToolkit</span><em>SIA</em></div>

  <div class="kopf-knoepfe">
    <button id="btn-rechnen" class="knopf knopf-haupt" title="Alle Nachweise rechnen">
      Rechnen
    </button>
    <button id="btn-dokumentation" class="knopf" aria-pressed="false"
            title="Formelsammlung, Python-Doku und Notizen -- das Notizbuch">
      Dokumentation
    </button>
    <button id="btn-speichern" class="knopf"
            title="Projekt als .json-Datei herunterladen (im Browser liegt es ohnehin)">
      Speichern
    </button>
    <button id="btn-oeffnen" class="knopf" title="Projekt aus einer .json-Datei laden">
      Öffnen
    </button>
  </div>

  <div id="zustandsanzeige" class="zustandsanzeige" role="status" aria-live="polite"></div>
</header>

<main class="raster" id="raster">

  <!-- ---------------------------------------------------------------- -->
  <section class="tafel tafel-links" id="tafel-baum">
    <div class="tafel-kopf tafel-kopf-projekt">
      <h2>Projekt</h2>
      <input id="projektname" class="projektname" type="text" aria-label="Projektname"
             placeholder="Name des Projekts">
    </div>
    <!-- Je App ein Knopf; darunter, in der rollenden Fläche, ihre Liste. -->
    <nav class="app-wahl" id="apps" aria-label="Apps"></nav>
    <div class="tafel-inhalt" id="baum"></div>
  </section>

  <div class="griff" data-griff="links" role="separator" aria-orientation="vertical"
       title="Breite des Projektbaums ziehen"></div>

  <!-- ---------------------------------------------------------------- -->
  <section class="tafel tafel-mitte" id="tafel-editor">
    <div class="tafel-kopf">
      <h2 id="editor-titel">Eingaben</h2>
      <span class="tafel-hinweis" id="editor-hinweis"></span>
    </div>
    <div class="tafel-inhalt panelstapel" id="editor"></div>
    <div class="fenster-grund" id="fenster" hidden></div>
  </section>

  <div class="griff" data-griff="mitte" role="separator" aria-orientation="vertical"
       title="Breite der Eingaben ziehen"></div>

  <!-- ---------------------------------------------------------------- -->
  <section class="tafel tafel-rechts" id="tafel-bericht">
    <div class="tafel-kopf">
      <h2 id="bericht-titel">Berechnung</h2>
      <button type="button" class="schalter" id="umfang"
              title="Alles zeigen oder nur den links gewählten Bestandteil -- Klicken schaltet um">
        <span class="schalter-halb ist-an" data-umfang="seite">Aktuelle Seite</span>
        <span class="schalter-halb" data-umfang="gesamt">Gesamt</span>
      </button>
      <div class="reiter" id="reiter">
        <button class="reiter-knopf ist-aktiv" data-reiter="nachweise">Zusammenfassung</button>
        <button class="reiter-knopf" data-reiter="diagramm">Diagramme</button>
        <button class="reiter-knopf" data-reiter="herleitung">Herleitung</button>
      </div>
    </div>
    <div class="tafel-inhalt" id="bericht"></div>
  </section>

</main>

<!-- Das Notizbuch: liegt über den Tafeln, solange die Adresse #notizbuch… lautet.
     Den Inhalt baut notizbuch.js; hier steht nur der Platz dafür. -->
<section id="notizbuch" class="notizbuch" hidden tabindex="-1" aria-label="Dokumentation"></section>

<!-- Nur auf schmalen Geräten sichtbar: dort steht immer eine Tafel allein, und
     hiermit wechselt man zwischen ihnen. Dasselbe Reiter-Muster wie oben
     rechts in der Berechnung -- es soll nicht zwei Arten geben, in diesem
     Werkzeug umzuschalten. Unten, weil der Daumen dort ist. -->
<nav class="tafelwahl reiter" id="tafelwahl" aria-label="Tafel wählen">
  <button class="reiter-knopf" data-tafel="links">Projekt</button>
  <button class="reiter-knopf ist-aktiv" data-tafel="mitte">Eingaben</button>
  <button class="reiter-knopf" data-tafel="rechts">Berechnung</button>
  <!-- Auf dem Telefon hat die Kopfleiste keinen Platz für einen fünften Knopf:
       das Notizbuch steht hier, als vierte Wahl. -->
  <button class="reiter-knopf" id="tafel-dokumentation" aria-pressed="false">Doku</button>
</nav>

<footer class="fussleiste">
  <span id="kernanzeige" class="kernanzeige" title="Wo gerechnet wird"></span>
</footer>

<div id="melder" class="melder" aria-live="polite"></div>

</body>
</html>
